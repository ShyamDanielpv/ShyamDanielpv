<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="4" viewBox="0 0 1000 4" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#DDB3A3" stop-opacity="0"/><stop offset="0.5" stop-color="#DDB3A3" stop-opacity="0.5"/><stop offset="1" stop-color="#DDB3A3" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#DDB3A3" stop-opacity="0"/><stop offset="0.5" stop-color="#F1E6E1" stop-opacity="1"/><stop offset="1" stop-color="#DDB3A3" stop-opacity="0"/></linearGradient></defs>
<rect width="1000" height="4" rx="2" fill="url(#base)"/>
<rect width="180" height="4" rx="2" fill="url(#sweep)"><animate attributeName="x" from="-180" to="1000" dur="3.5s" repeatCount="indefinite"/></rect></svg>