<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 42" width="490" height="42" role="img" aria-label="Contact Buttons: Email, LinkedIn, Call">
  <!-- ==================== BUTTON 1: EMAIL ==================== -->
  <g id="btn-email" transform="translate(2, 1)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite" begin="0s" />
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="3s" repeatCount="indefinite" begin="0s" />
      <g transform="translate(18, 9)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M20 4H4C2.9 4 2.01 4.9 2.01 6L2 18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="#DDB3A3" />
        </svg>
      </g>
    </g>
    <text x="48" y="23.5" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#F3E9E4">EMAIL</text>
  </g>

  <!-- ==================== BUTTON 2: LINKEDIN ==================== -->
  <g id="btn-linkedin" transform="translate(164, 1)">
    <rect x="0" y="0" width="165" height="38" rx="19" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite" begin="1s" />
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="3s" repeatCount="indefinite" begin="1s" />
      <g transform="translate(18, 9)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.96 11.24V10.13H10.17V18.5H12.96V13.57C12.96 12.8 13.58 12.17 14.35 12.17A1.4 1.4 0 0 1 15.75 13.57V18.5H18.5M6.46 10.13V18.5H9.2V10.13H6.46M7.83 5.88A1.66 1.66 0 1 0 9.49 7.54A1.66 1.66 0 0 0 7.83 5.88Z" fill="#DDB3A3" />
        </svg>
      </g>
    </g>
    <text x="48" y="23.5" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#F3E9E4">LINKEDIN</text>
  </g>

  <!-- ==================== BUTTON 3: CALL ==================== -->
  <g id="btn-phone" transform="translate(341, 1)">
    <rect x="0" y="0" width="140" height="38" rx="19" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite" begin="2s" />
    </rect>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="3s" repeatCount="indefinite" begin="2s" />
      <g transform="translate(18, 9)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M6.62 10.79C8.06 13.62 10.38 15.93 13.21 17.38L15.41 15.18C15.68 14.91 16.08 14.82 16.43 14.94C17.55 15.31 18.76 15.51 20 15.51C20.55 15.51 21 15.96 21 16.51V20C21 20.55 20.55 21 20 21C10.61 21 3 13.39 3 4C3 3.45 3.45 3 4 3H7.5C8.05 3 8.5 3.45 8.5 4C8.5 5.25 8.7 6.45 9.07 7.57C9.18 7.92 9.1 8.31 8.82 8.59L6.62 10.79Z" fill="#DDB3A3" />
        </svg>
      </g>
    </g>
    <text x="48" y="23.5" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#F3E9E4">CALL</text>
  </g>
</svg>
