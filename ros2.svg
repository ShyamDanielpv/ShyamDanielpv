<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150" role="img" aria-label="ROS 2 learning: sensor node publishes distance, control node publishes cmd_vel to motor node" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Currently learning ROS 2</title>
<rect x="0.5" y="0.5" width="799" height="149" rx="14" fill="#171E2B" stroke="#DDB3A3" stroke-opacity="0.3"/>
<text x="24" y="32" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="15" fill="#DDB3A3">Currently learning ROS 2</text>
<circle cx="776" cy="27" r="5" fill="#4ADE80"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
<rect x="30" y="63" width="150" height="44" rx="10" fill="#171E2B" stroke="#DDB3A3" stroke-opacity="0.5"/><text x="105" y="90" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#F1E6E1">sensor_node</text><rect x="325" y="63" width="150" height="44" rx="10" fill="#171E2B" stroke="#DDB3A3" stroke-opacity="0.5"/><text x="400" y="90" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#F1E6E1">control_node</text><rect x="620" y="63" width="150" height="44" rx="10" fill="#171E2B" stroke="#DDB3A3" stroke-opacity="0.5"/><text x="695" y="90" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#F1E6E1">motor_node</text>
<path id="e180" d="M180 85H325" stroke="#DDB3A3" stroke-opacity="0.4" stroke-dasharray="4 4"/><text x="252.5" y="74" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#8B94A3">/distance</text>
<circle r="4" fill="#4ADE80"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#e180"/></animateMotion></circle>
<circle r="4" fill="#4ADE80"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#e180"/></animateMotion></circle><path id="e475" d="M475 85H620" stroke="#DDB3A3" stroke-opacity="0.4" stroke-dasharray="4 4"/><text x="547.5" y="74" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#8B94A3">/cmd_vel</text>
<circle r="4" fill="#4ADE80"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#e475"/></animateMotion></circle>
<circle r="4" fill="#4ADE80"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#e475"/></animateMotion></circle>
<text x="24" y="134" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#8B94A3">nodes, topics and services</text>
</svg>