<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 40" width="165" height="40" role="img" aria-label="LinkedIn Contact Button">
  <!-- Pill shape background -->
  <rect x="1" y="1" width="163" height="38" rx="19" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;0.9;0.35" dur="3s" repeatCount="indefinite" begin="1s" />
  </rect>

  <!-- LinkedIn 'in' Icon with gentle vertical bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="3s" repeatCount="indefinite" begin="1s" />
    <g transform="translate(18, 10)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.96 11.24V10.13H10.17V18.5H12.96V13.57C12.96 12.8 13.58 12.17 14.35 12.17A1.4 1.4 0 0 1 15.75 13.57V18.5H18.5M6.46 10.13V18.5H9.2V10.13H6.46M7.83 5.88A1.66 1.66 0 1 0 9.49 7.54A1.66 1.66 0 0 0 7.83 5.88Z" fill="#DDB3A3" />
      </svg>
    </g>
  </g>

  <!-- Label Text -->
  <text x="48" y="24.5" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#F3E9E4">LINKEDIN</text>
</svg>
