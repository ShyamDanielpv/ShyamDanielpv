<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171E2B" />
      <stop offset="50%" stop-color="#141B26" />
      <stop offset="100%" stop-color="#0E131C" />
    </linearGradient>

    <!-- Rose Gold / Peach Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDB3A3" />
      <stop offset="100%" stop-color="#F2D5CB" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDB3A3" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#DDB3A3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#DDB3A3" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#DDB3A3" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="30" cy="0" r="1" fill="#DDB3A3" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 2px;
      fill: #FFFFFF;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 3px;
      fill: #DDB3A3;
      text-transform: uppercase;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.5px;
      fill: #DDB3A3;
      fill-opacity: 0.9;
    }
    .motto {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 1.5px;
      fill: #DDB3A3;
      fill-opacity: 0.75;
    }
    .trace {
      stroke: #DDB3A3;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)" stroke="#DDB3A3" stroke-width="1.2" stroke-opacity="0.3" />
  <rect width="900" height="240" rx="14" fill="url(#grid)" />

  <!-- Corner Tech Brackets -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#DDB3A3" stroke-width="2" fill="none" stroke-opacity="0.6" />
  <path d="M 880 40 L 880 20 L 860 20" stroke="#DDB3A3" stroke-width="2" fill="none" stroke-opacity="0.6" />
  <path d="M 20 200 L 20 220 L 40 220" stroke="#DDB3A3" stroke-width="2" fill="none" stroke-opacity="0.6" />
  <path d="M 880 200 L 880 220 L 860 220" stroke="#DDB3A3" stroke-width="2" fill="none" stroke-opacity="0.6" />

  <!-- Left Circuitry Artwork -->
  <g opacity="0.45">
    <path class="trace" d="M 40 120 L 90 120 L 120 90 L 150 90" stroke-opacity="0.6" />
    <circle cx="150" cy="90" r="3.5" fill="#DDB3A3" />
    <path class="trace" d="M 40 150 L 80 150 L 110 180 L 160 180" stroke-opacity="0.4" />
    <circle cx="160" cy="180" r="3" fill="#DDB3A3" />
    <!-- IC Chip Outline -->
    <rect x="50" y="60" width="40" height="40" rx="4" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" />
    <circle cx="70" cy="80" r="4" fill="#DDB3A3" fill-opacity="0.3" />
    <!-- IC Pins -->
    <line x1="44" y1="68" x2="50" y2="68" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="44" y1="76" x2="50" y2="76" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="44" y1="84" x2="50" y2="84" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="44" y1="92" x2="50" y2="92" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="90" y1="68" x2="96" y2="68" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="90" y1="76" x2="96" y2="76" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="90" y1="84" x2="96" y2="84" stroke="#DDB3A3" stroke-width="1.2" />
    <line x1="90" y1="92" x2="96" y2="92" stroke="#DDB3A3" stroke-width="1.2" />
  </g>

  <!-- Right Circuitry Artwork -->
  <g opacity="0.45">
    <path class="trace" d="M 860 120 L 810 120 L 780 150 L 750 150" stroke-opacity="0.6" />
    <circle cx="750" cy="150" r="3.5" fill="#DDB3A3" />
    <path class="trace" d="M 860 90 L 820 90 L 790 60 L 740 60" stroke-opacity="0.4" />
    <circle cx="740" cy="60" r="3" fill="#DDB3A3" />
    <!-- Robotic Joint schematic icon -->
    <circle cx="820" cy="165" r="16" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" />
    <circle cx="820" cy="165" r="7" fill="none" stroke="#DDB3A3" stroke-dasharray="2,2" />
    <circle cx="820" cy="165" r="2.5" fill="#DDB3A3" />
    <line x1="820" y1="149" x2="820" y2="135" stroke="#DDB3A3" stroke-width="1.5" />
    <line x1="820" y1="181" x2="820" y2="195" stroke="#DDB3A3" stroke-width="1.5" />
  </g>

  <!-- Central Pill Tag -->
  <g transform="translate(450, 42)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#171E2B" stroke="#DDB3A3" stroke-width="1.2" />
    <circle cx="-145" cy="0" r="3.5" fill="#DDB3A3" filter="url(#glow)" />
    <text x="5" y="4" text-anchor="middle" class="badge-text">MECHATRONICS · EMBEDDED · AUTOMATION</text>
  </g>

  <!-- Main Hero Title -->
  <text x="450" y="108" text-anchor="middle" class="name-title">SHYAM DANIEL PV</text>

  <!-- Subtitle -->
  <text x="450" y="142" text-anchor="middle" class="subtitle">AI-Driven Manufacturing · Embedded Firmware · Motion Control &amp; Robotics</text>

  <!-- Divider Line in Hero -->
  <line x1="280" y1="164" x2="620" y2="164" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="450" cy="164" r="3" fill="#DDB3A3" />

  <!-- Code/Terminal Style Motto -->
  <text x="450" y="194" text-anchor="middle" class="motto">&lt; Where code meets motion. &gt;</text>
</svg>
